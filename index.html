<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Countdown to Christmas 2026 — Für di best Fründin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #071915;
    --bg-bottom: #0d2b24;
    --gold: #f3c669;
    --gold-light: #ffe7a3;
    --gold-dark: #c5912c;
    --red: #d63638;
    --red-hover: #e64547;
    --card-bg: rgba(15, 42, 36, 0.72);
    --card-border: rgba(243, 198, 105, 0.28);
    --text-main: #fdfbf7;
    --text-muted: #b8cdc6;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 50% 0%, #15453a 0%, var(--bg-top) 55%, #040e0c 100%);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Sanfter Schneefall Canvas */
  #snowCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  /* Lichterkette oben */
  .garland {
    position: fixed;
    top: -6px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
    pointer-events: none;
    z-index: 10;
    padding: 0 10px;
  }

  .bulb {
    width: 10px;
    height: 16px;
    border-radius: 50% 50% 50% 50% / 35% 35% 65% 65%;
    background: var(--gold);
    box-shadow: 0 4px 16px var(--gold), 0 0 6px #fff;
    animation: glow 2.4s infinite alternate ease-in-out;
  }

  .bulb:nth-child(odd) {
    background: #ff6b6b;
    box-shadow: 0 4px 16px #ff4757, 0 0 6px #ffd1d1;
    animation-delay: 1.2s;
  }

  .bulb:nth-child(3n) {
    background: #ffeaa7;
    box-shadow: 0 4px 16px #fdcb6e, 0 0 6px #fff;
    animation-delay: 0.6s;
  }

  @keyframes glow {
    0% { opacity: 0.45; transform: scale(0.92); }
    100% { opacity: 1; transform: scale(1.08); }
  }

  main {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 560px;
    padding: 44px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Titelbereich */
  .header {
    text-align: center;
    margin-bottom: 26px;
  }

  .badge {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 999px;
    background: rgba(243, 198, 105, 0.14);
    border: 1px solid rgba(243, 198, 105, 0.35);
    color: var(--gold-light);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(2.2rem, 6.5vw, 3.4rem);
    font-weight: 900;
    line-height: 1.08;
    background: linear-gradient(135deg, #fff6d6 0%, var(--gold) 55%, var(--gold-dark) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 20px rgba(243, 198, 105, 0.22));
  }

  .subtitle {
    margin-top: 8px;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.3px;
  }

  /* Hauptkarte */
  .card {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 26px 22px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 
      0 24px 50px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.12);
  }

  /* Eingabezeile */
  .input-group {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  .input-wrapper {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
  }

  input[type="text"] {
    width: 100%;
    padding: 15px 38px 15px 18px;
    border-radius: 14px;
    border: 1.5px solid rgba(243, 198, 105, 0.25);
    background: rgba(5, 18, 15, 0.65);
    color: #fff;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    outline: none;
    transition: all 0.2s ease;
  }

  input[type="text"]::placeholder {
    color: rgba(184, 205, 198, 0.5);
    font-weight: 500;
  }

  input[type="text"]:focus {
    border-color: var(--gold);
    background: rgba(5, 18, 15, 0.85);
    box-shadow: 0 0 0 4px rgba(243, 198, 105, 0.15);
  }

  .clear-btn {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.2rem;
    cursor: pointer;
    display: none;
    padding: 4px;
    line-height: 1;
  }

  .clear-btn:hover {
    color: #fff;
  }

  button.btn-submit {
    padding: 0 22px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--red) 0%, #a82022 100%);
    color: #fff;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(214, 54, 56, 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    white-space: nowrap;
  }

  button.btn-submit:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, var(--red-hover) 0%, #b82527 100%);
    box-shadow: 0 12px 26px rgba(214, 54, 56, 0.45);
  }

  button.btn-submit:active {
    transform: translateY(0) scale(0.98);
  }

  /* Ergebnisanzeige */
  .result-box {
    margin-top: 20px;
    min-height: 112px;
    padding: 18px;
    border-radius: 16px;
    background: rgba(4, 15, 12, 0.55);
    border: 1px dashed rgba(243, 198, 105, 0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: all 0.3s ease;
  }

  .result-box.unlocked {
    background: linear-gradient(145deg, rgba(243, 198, 105, 0.14), rgba(214, 54, 56, 0.1));
    border: 1px solid rgba(243, 198, 105, 0.55);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  }

  .result-box.error {
    border-color: rgba(255, 107, 107, 0.5);
    background: rgba(214, 54, 56, 0.12);
  }

  .result-placeholder {
    color: var(--text-muted);
    font-size: 0.98rem;
    font-weight: 500;
  }

  .result-date {
    font-size: 0.85rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--gold);
    margin-bottom: 6px;
  }

  .result-content {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.65rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.25;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes popIn {
